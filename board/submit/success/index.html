<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Заявка отправлена — Северный маркет ВАРГИ</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07080a">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#07080a;--panel:#10161b;--line:#243541;--ink:#f2f5f8;--muted:#9ba8b3;--ice:#8fd0ef;--accent:#3e9bd6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,Arial,system-ui,sans-serif}.card{width:min(620px,calc(100% - 32px));padding:34px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(160deg,#10171d,#0a0f13)}.brand{font-weight:800;letter-spacing:.15em;font-size:20px}.brand span{color:var(--accent)}.eyebrow{margin-top:28px;color:var(--ice);text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:700}h1{margin:8px 0 12px;font-size:clamp(30px,7vw,48px);line-height:1.05}p{margin:0;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:11px 18px;border-radius:8px;border:1px solid var(--ice);background:var(--ice);color:#07131b;text-decoration:none;font-weight:700}.btn.secondary{background:transparent;color:var(--ice)}@media(max-width:520px){.card{padding:24px}.actions{display:grid}}
</style>
</head>
<body>
<main class="card">
<div class="brand" aria-label="ВАРГИ">В<span>А</span>Р<span>Г</span>И</div>
<div class="eyebrow">Северный маркет</div>
<h1>Заявка отправлена.</h1>
<p>Объявление и выбранные фотографии переданы на модерацию. После проверки карточка может быть опубликована в маркете.</p>
<div class="actions"><a class="btn" href="/board/">Вернуться в маркет</a><a class="btn secondary" href="/board/submit/">Подать ещё объявление</a></div>
</main>
</body>
</html>
