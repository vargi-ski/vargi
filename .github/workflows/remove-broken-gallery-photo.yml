name: Remove broken gallery photo

on:
  push:
    paths:
      - '.github/workflows/remove-broken-gallery-photo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove broken image entry
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const GALLERY = [PACK_IN_FRAME_PERM,window.VARGI_IMAGES.i30,"assets/pack-in-frame-ski-pair.webp","","","","",""];', 'const GALLERY = [PACK_IN_FRAME_PERM,"assets/pack-in-frame-ski-pair.webp","","","","","",""];')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Убрать поврежденное фото из галереи" || exit 0
          git push origin main
