name: Sync Northern Market listings

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch published listings
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            https://market-api-production-d9ab.up.railway.app/listings \
            -o /tmp/vargi-listings.json
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/vargi-listings.json','utf8'));
          if (!data.ok || !Array.isArray(data.listings)) throw new Error('Invalid listings response');
          fs.writeFileSync('assets/market-listings.js', 'window.VARGI_LISTINGS = ' + JSON.stringify(data.listings) + ';\n');
          NODE
      - name: Commit changes
        run: |
          git config user.name "vargi-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/market-listings.js
          if git diff --cached --quiet; then
            echo "No listing changes"
          else
            git commit -m "Sync published marketplace listings"
            git push origin main
          fi
