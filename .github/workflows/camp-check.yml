name: Camp signup checks
on:
  push:
    paths: ['camps/**', 'assets/camp-*.js', 'assets/camp-*.css', 'tests/camp.test.cjs', '.github/workflows/camp-check.yml']
  pull_request:
    paths: ['camps/**', 'assets/camp-*.js', 'assets/camp-*.css', 'tests/camp.test.cjs', '.github/workflows/camp-check.yml']
permissions:
  contents: read
jobs:
  camp:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/camp.test.cjs
