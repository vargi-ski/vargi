name: Add family gallery photo

on:
  push:
    paths:
      - '.github/triggers/add-family-gallery-photo.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add photo to gallery
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if '<script src="assets/image-data-10.js"></script>' not in s:
              s = s.replace('<script src="assets/image-data-09.js"></script>', '<script src="assets/image-data-09.js"></script>\n<script src="assets/image-data-10.js"></script>')
          old = 'const GALLERY = [PACK_IN_FRAME_PERM,"assets/pack-in-frame-ski-pair.webp","","","","","",""];'
          new = 'const GALLERY = [PACK_IN_FRAME_PERM,window.VARGI_IMAGES.i30,"assets/pack-in-frame-ski-pair.webp","","","","",""];'
          if 'window.VARGI_IMAGES.i30' not in s:
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Добавить семейное фото в галерею ВАРГИ"
            git push origin main
          fi
