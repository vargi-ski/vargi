name: Set Yandex Metrika

on:
  push:
    paths:
      - '.github/workflows/set-yandex-metrika.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set counter ID
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'yandexMetrikaId: null'
          new = 'yandexMetrikaId: 111210969'
          if old not in s and new not in s:
              raise SystemExit('Analytics placeholder not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/set-yandex-metrika.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/set-yandex-metrika.yml
          git commit -m "Подключить Яндекс Метрику 111210969"
          git push
