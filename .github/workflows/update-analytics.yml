name: Update private analytics

on:
  schedule:
    # Четыре независимых запуска в сутки: 04:10, 10:10, 16:10 и 22:10 МСК.
    # Отдельные записи упрощают контроль каждого планового запуска.
    - cron: '10 1 * * *'
    - cron: '10 7 * * *'
    - cron: '10 13 * * *'
    - cron: '10 19 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/update-analytics.mjs'
      - '.github/workflows/update-analytics.yml'

permissions:
  contents: write

concurrency:
  group: vargi-private-analytics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync latest main before collection
        run: git pull --ff-only origin main
      - name: Collect and encrypt analytics
        env:
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_BRIDGE_URL: ${{ secrets.GSC_BRIDGE_URL }}
          GSC_BRIDGE_KEY: ${{ secrets.GSC_BRIDGE_KEY }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: node scripts/update-analytics.mjs
      - name: Commit encrypted snapshot
        run: |
          if git diff --quiet -- analytics-dashboard/analytics.enc.json; then
            echo "No analytics changes"
            exit 0
          fi
          git config user.name "vargi-analytics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add analytics-dashboard/analytics.enc.json
          git commit -m "Update encrypted analytics snapshot"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Не удалось опубликовать снимок после трёх попыток"
          exit 1
