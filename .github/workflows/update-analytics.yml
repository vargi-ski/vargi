name: Update private analytics

on:
  schedule:
    # Четыре обновления в сутки: 04:10, 10:10, 16:10 и 22:10 МСК.
    # Clarity и Search Console запрашиваются один раз за запуск.
    - cron: '10 1,7,13,19 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update-analytics.mjs'
      - '.github/workflows/update-analytics.yml'

permissions:
  contents: write

concurrency:
  group: vargi-private-analytics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect and encrypt analytics
        env:
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_BRIDGE_URL: ${{ secrets.GSC_BRIDGE_URL }}
          GSC_BRIDGE_KEY: ${{ secrets.GSC_BRIDGE_KEY }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: node scripts/update-analytics.mjs
      - name: Commit encrypted snapshot
        run: |
          if git diff --quiet -- analytics-dashboard/analytics.enc.json; then
            echo "No analytics changes"
            exit 0
          fi
          git config user.name "vargi-analytics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add analytics-dashboard/analytics.enc.json
          git commit -m "Update encrypted analytics snapshot"
          git push
