name: Add Maksim Zubtsov

on:
  push:
    paths:
      - 'assets/image-data-09.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update participant data
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if '<script src="assets/image-data-09.js"></script>' not in s:
              s = s.replace('<script src="assets/image-data-08.js"></script>', '<script src="assets/image-data-08.js"></script>\n<script src="assets/image-data-09.js"></script>')

          roster_anchor = '  { name:"Алексей Мошкин", role:"Кандидат в мастера RL", bio:"Ухта, Республика Коми. Кандидат в мастера RussiaLoppet. 13 марафонов; лучший результат — 7-е место на «Шижме КЛ».", photo:window.VARGI_IMAGES.i09, rl:"https://russialoppet.ru/athletes/234609/", soc:"" },'
          roster_new = roster_anchor + '\n  { name:"Максим Зубцов", role:"Кандидат в мастера RL", bio:"Мурманск. Кандидат в мастера RussiaLoppet. 8 марафонов в 4 федеральных округах: четыре победы и регулярные места в первой пятёрке.", photo:window.VARGI_IMAGES.i29, rl:"https://russialoppet.ru/athletes/230038/", soc:"" },'
          if 'name:"Максим Зубцов"' not in s:
              s = s.replace(roster_anchor, roster_new)

          stats_anchor = '  { name:"Екатерина Бурянина",          skate:12, classic:2,  fastest:"2:26:28", fastestEvent:"Праздник Севера",        fastestYear:"2021", seasonMax:4,  seasonYear:"2025" }'
          stats_new = stats_anchor + ',\n  { name:"Максим Зубцов",                skate:8,  classic:0,  fastest:"1:57:51", fastestEvent:"Марафон МГУ",            fastestYear:"2019", seasonMax:4,  seasonYear:"2026" }'
          if '{ name:"Максим Зубцов",                skate:' not in s:
              s = s.replace(stats_anchor, stats_new)

          profile_anchor = '  "Екатерина Бурянина":"https://russialoppet.ru/athletes/29563/"'
          profile_new = profile_anchor + ',\n  "Максим Зубцов":"https://russialoppet.ru/athletes/230038/"'
          if '"Максим Зубцов":"https://russialoppet.ru/athletes/230038/"' not in s:
              s = s.replace(profile_anchor, profile_new)

          result_anchor = '  { year:"2026", athlete:"Екатерина Бурянина", event:"Токсово Марафон КЛ", time:"1:52:39", absPlace:5, group:"Ж30–34", groupPlace:1 }'
          result_new = result_anchor + ',\n  { year:"2026", athlete:"Максим Зубцов", event:"Настоящий Мужик", time:"2:18:34", absPlace:4, group:"М30–34", groupPlace:2 }'
          if 'athlete:"Максим Зубцов"' not in s:
              s = s.replace(result_anchor, result_new)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Добавить Максима Зубцова в состав ВАРГИ"
            git push origin main
          fi
